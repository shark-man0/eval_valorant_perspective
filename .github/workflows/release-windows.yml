name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-windows.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup installation failed."
            }
          }

      - name: Build and verify Windows release artifacts
        shell: pwsh
        run: .\scripts\release\build_release.ps1 -PythonExe python

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $Version = python scripts\release\release_tools.py version
          if ($LASTEXITCODE -ne 0) { throw "Version lookup failed." }
          "version=$Version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: VALORANT-AI-Coach-${{ steps.version.outputs.version }}-windows-release
          path: release/*
          if-no-files-found: error
