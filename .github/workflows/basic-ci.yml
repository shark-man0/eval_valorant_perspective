name: Basic CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Ensure FFmpeg and ffprobe
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg libegl1
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install project dependencies
        run: python -m pip install -e ".[gui,dev]"
      - name: Validate dataset contracts
        run: python tests/validate_dataset.py
      - name: Inventory Python text I/O (observational)
        run: |
          python scripts/audit_text_io.py --summary-json
          python scripts/audit_text_io.py --review-json
      - name: Run repository-contained tests with coverage
        run: python -m pytest --durations=25 --cov=valorant_ai_coach --cov-report=term-missing --cov-fail-under=75
      - name: Ruff
        run: python -m ruff check src tests scripts/e2e scripts/temporal_gt scripts/diagnostics/intake_recording.py scripts/diagnostics/register_private_sources.py
      - name: mypy
        env:
          MYPYPATH: src
        run: |
          python -m mypy src/valorant_ai_coach
          python -m mypy --explicit-package-bases -m scripts.temporal_gt.contract -m scripts.temporal_gt.validate_dataset
          python -m mypy --follow-imports=silent --explicit-package-bases scripts/diagnostics/register_private_sources.py
          python -m mypy --follow-imports=silent --explicit-package-bases scripts/temporal_gt/review_session.py scripts/temporal_gt/review_ui.py scripts/temporal_gt/packet_timing.py scripts/temporal_gt/review_windows.py
