name: Windows verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ensure FFmpeg integration-test dependency
        shell: pwsh
        run: |
          # FFmpeg.org lists this Windows distributor. Pin the release asset
          # and its SHA-256 so the runner uses direct binaries without package shims.
          $Release = "https://github.com/GyanD/codexffmpeg/releases/download/9.1"
          $Asset = "ffmpeg-9.1-essentials_build.zip"
          $Expected = "b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd"
          $Archive = Join-Path $env:RUNNER_TEMP $Asset
          $Bundle = Join-Path $env:RUNNER_TEMP "valorant-test-ffmpeg"
          Invoke-WebRequest -Uri "$Release/$Asset" -OutFile $Archive `
            -MaximumRetryCount 2 -RetryIntervalSec 5 -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash -ne $Expected) {
            throw "The FFmpeg release archive does not match the pinned SHA-256."
          }
          Expand-Archive -LiteralPath $Archive -DestinationPath $Bundle
          $BinaryDirectory = Join-Path $Bundle "ffmpeg-9.1-essentials_build/bin"
          foreach ($Name in @("ffmpeg.exe", "ffprobe.exe")) {
            & (Join-Path $BinaryDirectory $Name) -version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $BinaryDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -c constraints-windows.txt -e ".[gui,dev,build]"
      - run: python tests/validate_dataset.py
      - run: python -m pytest --durations=25 --cov=valorant_ai_coach --cov-report=term-missing --cov-fail-under=75
      - name: Verify UTF-8 contracts with Windows UTF-8 mode disabled
        shell: pwsh
        env:
          PYTHONUTF8: "0"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -c "import locale, sys; print('Windows locale encoding:', locale.getencoding()); assert sys.flags.utf8_mode == 0"
          python -m pytest tests/unit/test_text_io_encoding_audit.py -q
      - name: Inventory Python text I/O (observational)
        run: python scripts/audit_text_io.py --summary-json
      - run: python -m ruff check src tests scripts/e2e scripts/temporal_gt scripts/diagnostics/intake_recording.py scripts/diagnostics/register_private_sources.py scripts/diagnostics/analyze_personal_candidates.py scripts/diagnostics/diagnose_geometry_edges.py scripts/diagnostics/build_geometry_candidate.py scripts/diagnostics/diagnose_hud_transfer.py scripts/diagnostics/geometry_edge_similarity.py scripts/diagnostics/hud_semantic_review.py scripts/diagnostics/diagnose_result_text.py scripts/diagnostics/result_title_region.py
      - name: Type-check production and offline temporal data contracts
        env:
          MYPYPATH: src
        run: |
          python -m mypy src/valorant_ai_coach
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy --explicit-package-bases -m scripts.temporal_gt.contract -m scripts.temporal_gt.validate_dataset
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy --follow-imports=silent --explicit-package-bases scripts/diagnostics/register_private_sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy --follow-imports=silent --explicit-package-bases scripts/temporal_gt/review_session.py scripts/temporal_gt/review_ui.py scripts/temporal_gt/packet_timing.py scripts/temporal_gt/review_windows.py scripts/diagnostics/analyze_personal_candidates.py scripts/diagnostics/diagnose_geometry_edges.py scripts/diagnostics/build_geometry_candidate.py scripts/diagnostics/diagnose_hud_transfer.py scripts/diagnostics/geometry_edge_similarity.py scripts/diagnostics/hud_semantic_review.py scripts/diagnostics/diagnose_result_text.py scripts/diagnostics/result_title_region.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m PyInstaller --noconfirm --clean VALORANT-AI-Coach.spec
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "valorant-ai-coach-smoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $Process = Start-Process -FilePath "dist\VALORANT-AI-Coach\VALORANT-AI-Coach.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          $ExitCode = $Process.ExitCode
          if ($ExitCode -ne 0) {
            $LogPath = Join-Path $env:LOCALAPPDATA "ValorantAICoach\logs\valorant-ai-coach.log"
            if (Test-Path $LogPath) {
              Write-Host "----- packaged smoke log -----"
              Get-Content -Raw -Encoding UTF8 $LogPath
              Write-Host "----- end packaged smoke log -----"
            } else {
              Write-Warning "Packaged smoke log was not created: $LogPath"
            }
            throw "Packaged application smoke test failed with exit code $ExitCode."
          }
      - name: Smoke-test packaged Map operations
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "valorant-ai-coach-map-smoke"
          $env:VALORANT_MAP_SMOKE_PYTHON = (Get-Command python.exe).Source
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $Process = Start-Process -FilePath "dist\VALORANT-AI-Coach\VALORANT-AI-Coach.exe" -ArgumentList "--map-smoke-test" -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
            $LogPath = Join-Path $env:LOCALAPPDATA "ValorantAICoach\logs\valorant-ai-coach.log"
            if (Test-Path $LogPath) {
              Get-Content -Raw -Encoding UTF8 $LogPath
            }
            throw "Packaged Map smoke test failed with exit code $($Process.ExitCode)."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VALORANT-AI-Coach-windows-onedir
          path: dist/VALORANT-AI-Coach
