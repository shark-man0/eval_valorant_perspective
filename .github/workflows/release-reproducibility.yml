name: Independent Windows build comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/release/**'
      - 'constraints-windows.txt'
      - 'pyproject.toml'
      - '.github/workflows/release-reproducibility.yml'

permissions:
  contents: read

jobs:
  independent-build:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the same constrained Windows environment
        run: python -m pip install -c constraints-windows.txt -e ".[gui,dev,build]"
      - name: Validate resolved dependency graph
        run: python -m pip check
      - name: Build independent PyInstaller directory
        run: python -m PyInstaller --noconfirm --clean VALORANT-AI-Coach.spec
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "independent-smoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p = Start-Process -FilePath "dist\VALORANT-AI-Coach\VALORANT-AI-Coach.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged smoke failed ($($p.ExitCode))." }
      - name: Capture exact installed versions and every payload SHA-256
        shell: pwsh
        run: |
          $resolved = & python -m pip list --format=freeze
          if ($LASTEXITCODE -ne 0) { throw "pip list failed" }
          $resolved | Sort-Object | Set-Content -LiteralPath "independent-dependencies.txt" -Encoding UTF8
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "git rev-parse failed" }
          python scripts/release/build_snapshot.py capture --distribution dist/VALORANT-AI-Coach --dependencies independent-dependencies.txt --commit $commit --output independent-snapshot.json
          if ($LASTEXITCODE -ne 0) { throw 'build snapshot failed' }
      - name: Save complete textual evidence (not large binaries)
        uses: actions/upload-artifact@v4
        with:
          name: independent-windows-build-${{ matrix.replica }}
          path: |
            independent-snapshot.json
            independent-dependencies.txt
          if-no-files-found: error

  compare-builds:
    needs: independent-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: independent-windows-build-*
          path: independent-evidence
      - name: Compare independent Windows release-bundle trees
        run: |
          python scripts/release/build_snapshot.py compare --first independent-evidence/independent-windows-build-a/independent-snapshot.json --second independent-evidence/independent-windows-build-b/independent-snapshot.json --output independent-comparison.json
          cat independent-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: independent-windows-build-comparison
          path: independent-comparison.json
          if-no-files-found: error
