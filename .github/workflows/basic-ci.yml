name: Basic CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Ensure FFmpeg and ffprobe
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg libegl1
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install project dependencies
        run: python -m pip install -e ".[gui,dev]"
      - name: Validate dataset contracts
        run: python tests/validate_dataset.py
      - name: Run repository-contained tests with coverage
        run: python -m pytest --durations=25 --cov=valorant_ai_coach --cov-report=term-missing --cov-fail-under=75
      - name: Ruff
        run: python -m ruff check src tests scripts/e2e
      - name: mypy
        run: python -m mypy src/valorant_ai_coach
