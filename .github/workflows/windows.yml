name: Windows verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test offline display review UI
        run: node --test tests/js/test_frame_gate.cjs tests/js/test_simple_model.cjs tests/js/test_simple_ui.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ensure FFmpeg integration-test dependency
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $Installed = $false
            for ($Attempt = 1; $Attempt -le 3 -and -not $Installed; $Attempt++) {
              choco install ffmpeg --yes --no-progress
              $Installed = $LASTEXITCODE -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue)
              if (-not $Installed -and $Attempt -lt 3) {
                Start-Sleep -Seconds (10 * $Attempt)
              }
            }
            if (-not $Installed) { throw "FFmpeg installation failed after 3 attempts." }
          }
          # Killing a Chocolatey shim can leave its FFmpeg child holding the
          # decoder log open. Run the encoder itself for deterministic cleanup.
          $ResolvedFFmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          if ($env:ChocolateyInstall -and
              $ResolvedFFmpeg.StartsWith((Join-Path $env:ChocolateyInstall "bin"),
                  [System.StringComparison]::OrdinalIgnoreCase)) {
            $PackageTools = Join-Path $env:ChocolateyInstall "lib\ffmpeg\tools"
            $Encoders = @(Get-ChildItem -Path $PackageTools -Filter ffmpeg.exe -Recurse -File)
            if ($Encoders.Count -ne 1) {
              throw "Expected one FFmpeg binary in $PackageTools; found $($Encoders.Count)."
            }
            $BinaryDirectory = $Encoders[0].DirectoryName
            if (-not (Test-Path (Join-Path $BinaryDirectory "ffprobe.exe"))) {
              throw "The FFmpeg binary directory does not contain ffprobe.exe."
            }
            $BinaryDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$BinaryDirectory;$env:PATH"
          }
          (Get-Command ffmpeg -ErrorAction Stop).Source
          (Get-Command ffprobe -ErrorAction Stop).Source
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install -c constraints-windows.txt -e ".[gui,dev,build]"
      - run: python tests/validate_dataset.py
      - run: python -m pytest --durations=25 --cov=valorant_ai_coach --cov-report=term-missing --cov-fail-under=75
      - name: Verify UTF-8 contracts with Windows UTF-8 mode disabled
        shell: pwsh
        env:
          PYTHONUTF8: "0"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -c "import locale, sys; print('Windows locale encoding:', locale.getencoding()); assert sys.flags.utf8_mode == 0"
          python -m pytest tests/unit/test_text_io_encoding_audit.py -q
      - name: Inventory Python text I/O (observational)
        run: python scripts/audit_text_io.py --summary-json
      - run: python -m ruff check src tests scripts/e2e scripts/temporal_gt scripts/diagnostics/intake_recording.py scripts/diagnostics/register_private_sources.py scripts/diagnostics/analyze_personal_candidates.py scripts/diagnostics/diagnose_geometry_edges.py scripts/diagnostics/build_geometry_candidate.py scripts/diagnostics/diagnose_hud_transfer.py scripts/diagnostics/geometry_edge_similarity.py scripts/diagnostics/hud_semantic_review.py scripts/diagnostics/diagnose_result_text.py scripts/diagnostics/result_title_region.py scripts/diagnostics/round_transition_evidence.py scripts/diagnostics/round_lifecycle_evidence.py scripts/diagnostics/hud_failure_corpus.py scripts/diagnostics/hud_scope_structure.py scripts/diagnostics/timer_display_evidence.py scripts/diagnostics/score_border_background.py scripts/diagnostics/phase_structure_evidence.py scripts/diagnostics/display_review_scope.py scripts/diagnostics/display_review_simple.py
      - name: Type-check production and offline temporal data contracts
        env:
          MYPYPATH: src
        run: |
          python -m mypy src/valorant_ai_coach
          python -m mypy --explicit-package-bases -m scripts.temporal_gt.contract -m scripts.temporal_gt.validate_dataset
          python -m mypy --follow-imports=silent --explicit-package-bases scripts/diagnostics/register_private_sources.py
          python -m mypy --follow-imports=silent --explicit-package-bases scripts/temporal_gt/review_session.py scripts/temporal_gt/review_ui.py scripts/temporal_gt/packet_timing.py scripts/temporal_gt/review_windows.py scripts/diagnostics/analyze_personal_candidates.py scripts/diagnostics/diagnose_geometry_edges.py scripts/diagnostics/build_geometry_candidate.py scripts/diagnostics/diagnose_hud_transfer.py scripts/diagnostics/geometry_edge_similarity.py scripts/diagnostics/hud_semantic_review.py scripts/diagnostics/diagnose_result_text.py scripts/diagnostics/result_title_region.py scripts/diagnostics/round_transition_evidence.py scripts/diagnostics/round_lifecycle_evidence.py scripts/diagnostics/hud_failure_corpus.py scripts/diagnostics/hud_scope_structure.py scripts/diagnostics/timer_display_evidence.py scripts/diagnostics/score_border_background.py scripts/diagnostics/phase_structure_evidence.py scripts/diagnostics/display_review_scope.py scripts/diagnostics/display_review_simple.py
      - run: python -m PyInstaller --noconfirm --clean VALORANT-AI-Coach.spec
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "valorant-ai-coach-smoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $Process = Start-Process -FilePath "dist\VALORANT-AI-Coach\VALORANT-AI-Coach.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          $ExitCode = $Process.ExitCode
          if ($ExitCode -ne 0) {
            $LogPath = Join-Path $env:LOCALAPPDATA "ValorantAICoach\logs\valorant-ai-coach.log"
            if (Test-Path $LogPath) {
              Write-Host "----- packaged smoke log -----"
              Get-Content -Raw -Encoding UTF8 $LogPath
              Write-Host "----- end packaged smoke log -----"
            } else {
              Write-Warning "Packaged smoke log was not created: $LogPath"
            }
            throw "Packaged application smoke test failed with exit code $ExitCode."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VALORANT-AI-Coach-windows-onedir
          path: dist/VALORANT-AI-Coach
