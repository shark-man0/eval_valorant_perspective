<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roundの確認・簡単版</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f7;color:#172c3c;font-family:system-ui,-apple-system,sans-serif;font-size:18px}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}h2{font-size:28px;margin:24px 0 10px}p{line-height:1.6}.muted{color:#526577;font-size:15px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0 8px}.label{font-weight:700;font-size:22px;margin-bottom:10px}.crop{height:210px;overflow:hidden;background:#101820;border-radius:12px;cursor:zoom-in;border:2px solid #d1dce3}.crop img{width:240%;max-width:none;position:relative;left:-70%;height:auto;display:block}button{font:inherit;cursor:pointer;border:1px solid #bdcbd6;background:white;color:#123047;border-radius:10px;padding:15px 22px;min-height:56px}button:hover:not(:disabled){background:#e7f1fc;border-color:#3d79ae}button:disabled{opacity:.45;cursor:wait}#choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}#loading{min-height:28px;color:#566777;font-size:16px;margin:16px 0}#numbers{display:grid;grid-template-columns:1fr 1fr;gap:18px}input.digit{width:95px;font:inherit;font-size:26px;padding:10px;border:1px solid #b8c8d5;border-radius:8px}label{line-height:1.7}#numbers label{display:inline-flex;align-items:center;margin:5px;gap:8px}#back{margin-top:24px}details{margin:28px 0;color:#4b6070;font-size:16px}details summary{cursor:pointer}details p{max-width:850px}#player{max-width:900px;margin:14px auto}#player img{width:100%;height:auto}dialog{width:min(1400px,96vw);border:0;border-radius:12px;padding:12px}dialog img{width:100%;height:auto}#summaryText{white-space:pre-line;font-size:22px;line-height:1.9;background:white;padding:24px;border-radius:12px}#save{background:#176da7;color:white;margin-top:18px}#saved{display:block;margin:18px 0;line-height:1.6}[hidden]{display:none!important}@media(max-width:800px){main{padding:16px}h2{font-size:24px}.pair,#numbers,#choices{grid-template-columns:1fr}.crop{height:190px}}
</style><main><h1>Roundの確認・簡単版</h1><p class="muted">3つの質問だけです。分からない項目は飛ばせます。画像を押すと元画像全体を表示します。</p><b id="progress"></b>
<section id="review"><h2 id="title"></h2><p id="help"></p><div class="pair"><div><div class="label">前の画像</div><div class="crop"><img id="image0" alt="前の原映像"></div></div><div><div class="label">後の画像</div><div class="crop"><img id="image1" alt="後の原映像"></div></div></div>
<div id="numbers" hidden><div><label>左の数字 <input class="digit needs-ready" inputmode="numeric" type="number" min="0" max="99"></label><label>右の数字 <input class="digit needs-ready" inputmode="numeric" type="number" min="0" max="99"></label></div><div><label>左の数字 <input class="digit needs-ready" inputmode="numeric" type="number" min="0" max="99"></label><label>右の数字 <input class="digit needs-ready" inputmode="numeric" type="number" min="0" max="99"></label></div></div>
<div id="loading" role="status"></div><div id="choices"></div>
<details id="extra"><summary>短い映像を再生して詳しく見る（任意）</summary><p>原映像の全フレームをゆっくり再生します。画像読み込みのため、実際の映像時間より長くなる場合があります。</p><button id="play">再生</button><button id="stop">停止</button><div id="player" hidden><div class="crop"><img id="playerImage" alt="原映像の連続画像"></div><output id="playerIndex"></output></div>
<p><label><input id="full" type="checkbox" disabled> この短い映像全体を自分で確認した</label></p><p class="muted">全画像を読み込んだ後だけ選択できます。自動再生だけで確認済みにはしません。</p><p><label><input id="noAppearance" type="checkbox"> 映像全体で新たな終了文字は一度も出なかった</label></p><p><label><input id="noScore" type="checkbox"> 映像全体でScoreの変化もなかった</label></p><p><label><input id="cut" type="checkbox"> 映像が飛んだ・切れた疑いがある</label></p></details></section>
<section id="summary" hidden><h2>回答を保存してください</h2><p id="summaryText"></p><button id="save">回答JSONを保存</button><output id="saved"></output></section><button id="back" hidden>ひとつ戻る</button>
<p class="muted">予測値は表示していません。回答と原映像の対応は自動保存します。未確認の範囲は不明のまま扱います。</p></main>
<dialog id="dialog"><button id="close">閉じる</button><img id="original" alt="元画像全体"></dialog>
<script id="data" type="application/json">__REVIEW_PAYLOAD__</script><script>__REVIEW_SCRIPTS__</script></html>
