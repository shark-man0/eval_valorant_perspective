name: Temporary Windows release validation

on:
  push:
    branches:
      - external/windows-release

permissions:
  contents: read

concurrency:
  group: temporary-windows-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-windows.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup installation failed."
            }
          }

      - name: Build and verify release candidate
        shell: pwsh
        run: .\scripts\release\build_release.ps1 -PythonExe python

      - uses: actions/upload-artifact@v4
        with:
          name: temporary-windows-release-validation
          path: release/*
          if-no-files-found: error
